services:
  - type: web
    name: almacensga-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: INTEGRATION_EXECUTION_MODE
        value: SIMULATED
      - key: INTEGRATION_TIMEOUT_MS
        value: "10000"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "8"
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: "900000"
